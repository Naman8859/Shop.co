<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="stylesheet" href="../css/productPageCss/global.css">
    <link rel="stylesheet" href="../css/productPageCss/navbar.css">
    <link rel="stylesheet" href="../css/productPageCss/productSection.css">
    <link rel="stylesheet" href="../css/productPageCss/responsive.css">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">

</head>
<body>
     <div class="preloader">
        <h1>SHOP.CO</h1>
    </div>
    <div class="section1">
        <div class="slider">
            <div class="close">
                <img src="../assets/close.png" alt="">
            </div>
            <div class="slider-access-area">
                <h4>On Sale</h4>
                <h4>New Arrivals</h4>
                <h4>Brands</h4>
            </div>
        </div>
        <div class="navbar">

            <div class="comp-name">
                <div class="hamburger">
                    <img src="../assets/hamburger(1).png" alt="">
                </div>
                <h1>SHOP.CO</h1>
            </div>
            <div class="access-area">
                <select>
                    <option value="">Shop</option>
                    <option value="">Men</option>
                    <option value="">Women</option>
                    <option value="">Kids</option>
                </select>
                <h4>On Sale</h4>
                <h4>New Arrivals</h4>
                <h4>Brands</h4>
            </div>
            <div class="search-bar">

                <div class="search">
                    <span><img class="desktop-search" src="../assets/search1.png" alt=""></span>
                    <input type="search" placeholder="Search for products...">
                </div>
            </div>
            <div class="cart-profile">
                <div class="search-icon">
                    <img class="mobSearch mob" src="../assets/search1.png" alt="">
                </div>
                <span class="cart "><img class="mob" src="../assets/cart1.png" alt=""></span>
                <span class="profile "><img class="mob" src="../assets/profile1.png" alt=""></span>
            </div>

        </div>
    </div>
    
    <div class="nav-breaker"></div>

    <div class="productSection">
        <div class="productImages">
            <div class="verticalSlider">
            </div>
            <div class="card">
            <img src="" alt="">
        </div>
        </div>
        <div class="productDetails">
            <div class="prodHead">
                <h1>ONE LIFE GRAPHIC T-SHIRT</h1>
            </div>
            <div class="prodPrice">
                <h2>$120</h2>
            </div>
            <div class="prodDesc">
                <p>This graphic t-shirt which is perfect for any occasion. Crafted from a soft and breathable fabric, it offers superior comfort and style.</p>
            </div>
            <div class="selectColors">
                <p>Select Colors</p>
            </div>
            <div class="chooseSize"></div>
            <div class="addToCart"></div>


        </div>

        
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
        integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="../js/productPage/main.js"></script>
</body>
</html>
